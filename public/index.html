<style>

:root[data-theme="dark"]{--bg:#0b1426;--alt:#101c34;--card:#13203a;--tx:#eaf0ff;--mu:#a3b5d8;--pr:#8fb2ff;--pr2:#1b2d52;--bd:#4a6296;--ln:#26385e;--sh:#050b18;--btn:#8fb2ff;--btnt:#0b1426;--inv:#1b2d52}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}

:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
/* topo */

header h1{font-size:20px;line-height:1.1;margin:0;flex:1;min-width:190px;display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}

h2,h3,h4{margin:.1em 0 .6em;line-height:1.2;letter-spacing:-.01em}
h2{font-size:28px}h3{font-size:22px}h4{font-size:17px;color:var(--pr);margin-top:16px}

.row>h2,.row>h3{margin-bottom:.1em}
.mu{color:var(--mu)}

.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:12px 22px;border-radius:14px;font:inherit;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block;box-shadow:0 3px 0 var(--sh)}

label{display:block;font-weight:700;margin:14px 0 6px;font-size:15px}

.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid currentColor}
.chip.aceito{background:#d8f3e3;color:#14663a}.chip.pendente{background:#fdf1c8;color:#7a5b00}.chip.recusado{background:#fbdcd8;color:#9b2a1d}.chip.faltou{background:#e4e4e8;color:#444}

.item{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}.item:last-child{border-bottom:0}
.dt{min-width:58px;text-align:center;background:var(--go);color:#0f1f45;border:1px solid var(--bd);border-radius:14px;padding:6px 4px;line-height:1.2}.dt b{display:block;font-size:16px}
.gr{flex:1;min-width:140px}

.big{font-size:22px;font-weight:700;color:var(--pr);margin:10px 0}
/* ministérios (cartões de serviço) */
.grid>.card{margin-bottom:0;padding:24px}
.grid>.card:nth-child(3n+1){background:var(--alt)}
.grid>.card:nth-child(3n+2){background:var(--go);color:#0f1f45}.grid>.card:nth-child(3n+2) .mu{color:#3a4668}.grid>.card:nth-child(3n+2) h3{background:#fff}
.grid>.card:nth-child(3n+3){background:var(--inv);color:#fff}.grid>.card:nth-child(3n+3) .mu{color:#c9d4ee}
/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.cal b{font-size:13px;color:var(--mu)}
.d{aspect-ratio:1;border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer;padding:0}
.d.cd{border-color:var(--bd);background:var(--alt);font-weight:700}.d.has{box-shadow:inset 0 -5px 0 var(--go)}.d.sel{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
/* tabelas e barras */
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:10px 8px;border-bottom:1px solid var(--ln);text-align:left}th{border-bottom:2px solid var(--bd)}
.bar{height:12px;background:var(--pr2);border:1px solid var(--bd);border-radius:12px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--go)}.over{color:var(--er);font-weight:700}.over+.bar i{background:var(--er)}
/* diálogos e aviso */
.ov{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.ov .card{max-width:440px;width:100%;margin:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0f1f45;color:#fff;border:1px solid var(--go);padding:12px 20px;border-radius:14px;z-index:30;display:none;max-width:90%;text-align:center;box-shadow:0 4px 0 var(--go)}
@media(max-width:600px){:root{--r:24px}nav{width:100%;flex-wrap:nowrap;gap:2px}nav button{padding:9px 10px;font-size:14px}.card{padding:20px}main{padding:20px 14px 48px}header{padding:12px 14px}.grid>.card{padding:20px}}
@media(prefers-reduced-motion:reduce){.btn:active{transform:none}}
@media print{header,.tabs,.btn,.noprint{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none}}
</style></head><body>
<header><h1><span class="logo">✝</span><span>Escalas de Voluntários <small id="sync"></small></span></h1>
<nav><button data-v="me" onclick="go('me')">🙋 Início</button><button data-v="ag" onclick="go('ag')">📅 Agenda</button><button data-v="ld" onclick="go('ld')">🛡️ Líder</button><button onclick="tema()" title="Modo claro/escuro">🌓</button></nav></header>
<main id="app"></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' '),uid=()=>Math.random().toString(36).slice(2,9),tk=()=>Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join(''),pad=n=>String(n).padStart(2,'0');

const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'],CD=[0,3,6],HORA={0:'19:00',3:'19:30',6:'19:00'},okMin=(c,m)=>m!='Transmissão'||c.dia==6;
const today=()=>{const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`},dow=s=>new Date(s+'T12:00:00').getDay(),fd=s=>s.slice(8)+'/'+s.slice(5,7);

function gen(ym){const [y,m]=ym.split('-').map(Number),o=[];for(let d=1;d<=new Date(y,m,0).getDate();d++){const s=`${ym}-${pad(d)}`,w=dow(s);if(CD.includes(w))o.push({id:uid(),data:s,dia:w,hora:HORA[w],tipo:'Culto de '+DIAS[w]})}return o}
let S={vols:[],cultos:[],esc:[],av:[],admins:[],lim:4},VER=0,PERSIST=true,WA=false,ENV={},TG='off',FILA=null,WAUTO=ls('waauto')!==false,KEY=(()=>{try{return sessionStorage.getItem('esc_key')}catch(e){return null}})(),V='me',me=ls('me'),reg=null,ym=today().slice(0,7),fm='',ff='',fv='',selD='',at='esc',sc='',sm='Mídia',sf='',sv='',ed=null,TK=null,TKD=null;

const conflito=(vid,cid,ig)=>{const c=cu(cid);return S.esc.find(e=>e.vol==vid&&e.id!=ig&&e.st!='recusado'&&cu(e.culto)&&cu(e.culto).data==c.data&&cu(e.culto).hora==c.hora)};

const chip=s=>`<span class="chip ${s}">${{aceito:'✔ Aceito',pendente:'⏳ Pendente',recusado:'✖ Recusado',faltou:'⚠ Faltou'}[s]||s}</span>`;
const opt=(a,val)=>a.map(([v,t])=>`<option value="${esc(v)}" ${v==val?'selected':''}>${esc(t)}</option>`).join('');
const link=e=>location.href.split('#')[0]+'#t='+e.tok,msg=e=>{const c=cu(e.culto);return`Olá, ${vn(e.vol).nome}! Você foi escalado(a) em ${e.min} – ${e.func}, ${DIAS[c.dia]} ${fd(c.data)} às ${c.hora}. Confirme ou recuse por este link: ${link(e)}`};
const wa=e=>{let z=(vn(e.vol).zap||'').replace(/\D/g,'');if(z&&z.length<=11)z='55'+z;return`https://wa.me/${z}?text=${encodeURIComponent(msg(e))}`},ml=e=>`mailto:${vn(e.vol).mail||''}?subject=${encodeURIComponent('Sua escala na igreja')}&body=${encodeURIComponent(msg(e))}`;
const dt=(c,a)=>{const [h,m]=c.hora.split(':').map(Number);return c.data.replace(/-/g,'')+'T'+pad(h+a)+pad(m)+'00'},gcal=(c,d)=>`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(c.tipo)}&dates=${dt(c,0)}/${dt(c,2)}&details=${encodeURIComponent(d)}`;

function dlg(t,inp,ok){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class=card><p>${t}</p>${inp?'<textarea id=dg rows=3></textarea>':''}<div class=row><button class="btn p" id=dy>OK</button><button class=btn id=dn>Cancelar</button></div></div>`;document.body.appendChild(o);o.querySelector('#dn').onclick=()=>o.remove();o.querySelector('#dy').onclick=()=>{const v=inp?o.querySelector('#dg').value.trim():1;o.remove();ok(v)}}
function tema(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark';ls('tema',r.dataset.theme)}

async function enviarWA(ids){try{const j=await api('/api/whatsapp/enviar',{method:'POST',body:{esc:ids,base:location.origin}}),ok=j.resultados.filter(r=>r.ok).length,bad=j.resultados.filter(r=>!r.ok);toast(`📲 ${ok} enviado(s)`+(bad.length?` · ${bad.length} falhou: ${bad[0].erro}`:''))}catch(e){toast(e.message)}await load()}

if(id)Object.assign(S.vols.find(x=>x.id==id),d);else{d.id=uid();S.vols.push(d)}ed=null;save();toast('Salvo!')}
/* ---------- início / voluntário ---------- */
function entrar(){const n=$('#nm').value.trim();if(!n)return toast('Digite seu nome.');const v=S.vols.find(x=>norm(x.nome)==norm(n));if(v){me=v.id;ls('me',me);render()}else{reg={nome:n};render()}}

const v=S.vols.find(x=>x.id==me);if(!v)return`<div class="card hero"><div class=cross>✝</div><h2>Bem-vindo(a)!</h2><p class=mu>Identifique-se apenas com seu nome — sem senha.</p><label>Digite seu nome</label><input id=nm list=dl autocomplete=off placeholder="Seu nome completo" onkeydown="if(event.key=='Enter')entrar()"><datalist id=dl>${S.vols.map(x=>`<option value="${esc(x.nome)}">`).join('')}</datalist><div class=row style="justify-content:center"><button class="btn g" onclick="entrar()">Entrar</button><button class=btn onclick="go('ag')">📅 Ver agenda pública</button></div></div><div class=grid>${Object.keys(M).map(m=>`<div class=card><h3>${M[m].i} ${m}</h3><p class=mu>${M[m].f.join(' · ')}</p></div>`).join('')}</div>`;
const mine=S.esc.filter(e=>e.vol==v.id&&cu(e.culto)).sort((a,b)=>cu(a.culto).data.localeCompare(cu(b.culto).data)),t=today(),pr=mine.filter(e=>cu(e.culto).data>=t),hi=mine.filter(e=>cu(e.culto).data<t).reverse();
const row=(e,a)=>{const c=cu(e.culto);return`<div class=item><div class=dt><b>${fd(c.data)}</b><small>${DIAS[c.dia].slice(0,3)}</small></div><div class=gr><b>${mi(e.min)} ${esc(e.func)}</b><div class=mu>${e.min} · ${c.hora} · ${DIAS[c.dia]}</div>${chip(e.st)}</div>${a?`<div class=row style="margin:0"><button class="btn ok s" onclick="resp('${e.id}','aceito')">Confirmar presença</button><button class="btn no s" onclick="resp('${e.id}','recusado')">Não posso ir</button><button class="btn s" onclick="troca('${e.id}')">🔁 Trocar/avisar</button><a class="btn s" target=_blank rel=noopener href="${gcal(c,e.min+' – '+e.func)}">📅</a><button class="btn s" onclick="icsE('${e.id}')">.ics</button></div>`:''}</div>`};
return`<div class=card><div class=row style="margin:0;justify-content:space-between"><h2>Olá, ${esc(v.nome)}! 🙏</h2><button class="btn s" onclick="me=null;ls('me',null);render()">Sair</button></div><p class=mu>${minsOf(v).map(m=>mi(m)+' '+m).join(' · ')} — Escalas neste mês: <b>${cnt(v.id,t.slice(0,7))}</b></p></div><div class=card><h3>Próximas escalas</h3>${pr.map(e=>row(e,1)).join('')||'<p class=mu>Nenhuma escala por enquanto.</p>'}<p class=mu><small>Para confirmar/recusar, use o link pessoal recebido por WhatsApp ou e-mail.</small></p></div><div class=card><h3>Histórico</h3>${hi.map(e=>row(e,0)).join('')||'<p class=mu>Sem histórico.</p>'}</div>`}
const minsOf=v=>Object.keys(M).filter(m=>M[m].f.some(f=>v.funcs.includes(f)));
function resp(id,st,tok){tok=tok||(ls('toks')||{})[id];if(!tok)return toast('Para confirmar, abra o link pessoal enviado por WhatsApp ou e-mail.');api('/api/t/'+tok,{method:'POST',body:{st}}).then(()=>{if(TKD&&TKD.escala)TKD.escala.st=st;toast(st=='aceito'?'Presença confirmada! 🙏':'Recusa registrada. O líder foi avisado.');return load()}).catch(e=>toast(e.message))}
function troca(id){dlg('Quer trocar ou avisar algo ao líder? Escreva a mensagem:',1,m=>api('/api/aviso',{method:'POST',body:{vol:me,esc:id,msg:m||'Pede troca'}}).then(()=>toast('Aviso enviado ao líder.')).catch(e=>toast(e.message)))}
function vTok(){if(!TKD||TKD.tok!=TK){api('/api/t/'+TK).then(j=>{j.tok=TK;TKD=j;const k=ls('toks')||{};k[j.escala.id]=TK;ls('toks',k);render()}).catch(()=>{TKD={tok:TK,erro:1};render()});return'<div class=card><p class=mu>Carregando…</p></div>'}
if(TKD.erro)return`<div class=card><h2>Link não encontrado</h2><p class=mu>O link é inválido ou foi substituído. Peça um novo link ao líder.</p><button class="btn p" onclick="go('ag')">Ver agenda</button></div>`;
const e=TKD.escala,c=TKD.culto;return`<div class="card hero"><div class=cross>✝</div><h2>Olá, ${esc(TKD.vol.nome)}!</h2><p>Você foi escalado(a):</p><div class=big>${mi(e.min)} ${esc(e.min)} — ${esc(e.func)}</div><p>${DIAS[c.dia]}, ${fd(c.data)} às ${c.hora}<br>${esc(c.tipo)}</p><p>Situação: ${chip(e.st)}</p><div class=row style="justify-content:center"><button class="btn ok" onclick="resp('${e.id}','aceito','${TK}')">✔ Confirmar presença</button><button class="btn no" onclick="resp('${e.id}','recusado','${TK}')">✖ Não posso ir</button></div></div>`}
/* ---------- agenda pública ---------- */
function vAg(){const [y,m]=ym.split('-').map(Number),first=new Date(y,m-1,1).getDay(),n=new Date(y,m,0).getDate();let g='<div class=cal>'+'DSTQQSS'.split('').map(x=>`<b>${x}</b>`).join('')+'<i></i>'.repeat(first);
for(let d=1;d<=n;d++){const s=`${ym}-${pad(d)}`;g+=`<button class="d ${CD.includes(dow(s))?'cd':''} ${S.cultos.some(c=>c.data==s)?'has':''} ${selD==s?'sel':''}" onclick="selD=selD=='${s}'?'':'${s}';render()">${d}</button>`}g+='</div>';
const flt=fm||ff||fv,fs=fm?M[fm].f:Object.values(M).flatMap(x=>x.f);
const blk=c=>{const es=S.esc.filter(e=>e.culto==c.id&&(!fm||e.min==fm)&&(!ff||e.func==ff)&&(!fv||e.vol==fv));if(flt&&!es.length)return'';let h=`<div class=card><div class=row style="margin:0;justify-content:space-between"><b>${DIAS[c.dia]}, ${fd(c.data)} · ${c.hora}</b><span><a class="btn s" target=_blank rel=noopener href="${gcal(c,det(c))}">📅 Google Calendar</a> <button class="btn s" onclick="icsC('${c.id}')">⬇ .ics</button></span></div>`;
for(const k in M){if(!okMin(c,k)||(fm&&fm!=k))continue;let r='';for(const f of M[k].f){if(ff&&ff!=f)continue;const l=es.filter(e=>e.func==f);if(flt&&!l.length)continue;r+=`<div class=item style="padding:4px 0"><span class=gr>${esc(f)}</span>${l.length?l.map(e=>`<span>${esc(vn(e.vol).nome)} ${chip(e.st)}</span>`).join(' '):'<span class=mu>— vaga —</span>'}</div>`}if(r)h+=`<h4>${M[k].i} ${k}</h4>`+r}return h+'</div>'};
const cs=S.cultos.filter(c=>selD?c.data==selD:c.data.startsWith(ym)).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
return`<div class=card><h2>📅 Agenda</h2><div class=grid><div><label>Mês</label><input type=month value="${ym}" onchange="ym=this.value||ym;selD='';render()"></div><div><label>Ministério</label><select onchange="fm=this.value;ff='';render()"><option value="">Todos</option>${opt(Object.keys(M).map(x=>[x,x]),fm)}</select></div><div><label>Função</label><select onchange="ff=this.value;render()"><option value="">Todas</option>${opt(fs.map(x=>[x,x]),ff)}</select></div><div><label>Voluntário</label><select onchange="fv=this.value;render()"><option value="">Todos</option>${opt(S.vols.map(v=>[v.id,v.nome]),fv)}</select></div></div></div><div class=card><p class=mu style="margin-top:0">Destaque dourado: domingo, quarta e sábado. Toque num dia para filtrar.</p>${g}</div>${cs.map(blk).join('')||'<div class=card><p class=mu>Nenhum culto encontrado.</p></div>'}`}
/* ---------- painel do líder ---------- */
function vLd(){if(!isAdm())return`<div class="card hero"><div class=cross>🛡️</div><h2>Painel do líder</h2><p class=mu>Digite o nome de um líder cadastrado.</p><input id=an placeholder="Nome do líder" onkeydown="if(event.key=='Enter')admIn()"><div class=row style="justify-content:center"><button class="btn g" onclick="admIn()">Entrar</button></div></div>`;
const T=[['esc','🗓️ Escalas'],['vol','👥 Voluntários'],['cul','⛪ Cultos'],['rod','⚖️ Rodízio'],['rel','📊 Relatórios'],['adm','🔑 Líderes']];
return(PERSIST?'':'<div class=card style="border-color:#c0392b">⚠️ <b>Banco temporário:</b> os dados podem ser apagados a qualquer momento. Conecte um banco Postgres (variável DATABASE_URL) no servidor.</div>')+`<div class=tabs>${T.map(([k,t])=>`<button class="btn s ${at==k?'on':''}" onclick="at='${k}';ed=null;render()">${t}</button>`).join('')}<button class="btn s" onclick="sair()">Sair</button></div>`+({esc:tEsc,vol:tVol,cul:tCul,rod:tRod,rel:tRel,adm:tAdm}[at])()}
function admIn(){api('/api/admin/login',{method:'POST',body:{nome:$('#an').value}}).then(j=>{KEY=j.chave;try{sessionStorage.setItem('esc_key',KEY)}catch(e){}return load()}).catch(e=>toast(e.message))}
const mes=()=>`<label>Mês</label><input type=month value="${ym}" onchange="ym=this.value||ym;render()" style="max-width:200px">`;
function tEsc(){if(!cu(sc))sc=(S.cultos.find(c=>c.data>=today())||S.cultos[0]||{}).id||'';const c=cu(sc);if(c&&!okMin(c,sm))sm='Mídia';if(!M[sm].f.includes(sf))sf=M[sm].f[0];const L=c?elig(c,sf):[];if(!L.find(x=>x.v.id==sv))sv=L[0]?L[0].v.id:'';
const es=S.esc.filter(e=>e.culto==sc),pend=es.filter(e=>!(ENV[e.id]&&ENV[e.id].ok)&&vn(e.vol).zap).map(e=>e.id);
return`${S.av.length?`<div class=card><h3>🔔 Avisos</h3>${S.av.map(a=>`<div class=item><div class=gr><b>${esc(vn(a.vol).nome)}</b>: ${esc(a.msg)}</div><button class="btn s" onclick="S.av=S.av.filter(x=>x.id!='${a.id}');save()">Dispensar</button></div>`).join('')}</div>`:''}<div class=card><h3>Criar escala</h3><div class=grid><div><label>Culto</label><select onchange="sc=this.value;render()">${opt(S.cultos.slice().sort((a,b)=>a.data.localeCompare(b.data)).map(x=>[x.id,`${fd(x.data)} ${DIAS[x.dia]} ${x.hora}`]),sc)}</select></div><div><label>Ministério</label><select onchange="sm=this.value;render()">${opt(Object.keys(M).filter(k=>!c||okMin(c,k)).map(x=>[x,mi(x)+' '+x]),sm)}</select></div><div><label>Função</label><select onchange="sf=this.value;render()">${opt(M[sm].f.map(x=>[x,x]),sf)}</select></div><div><label>Voluntário (sugestões primeiro)</label><select onchange="sv=this.value">${L.map((x,i)=>`<option value="${x.v.id}" ${x.v.id==sv?'selected':''}>${i==0&&x.ok?'⭐ ':''}${esc(x.v.nome)} — ${x.n}x no mês${x.ok?'':' (indisponível no dia)'}${x.n>=S.lim?' ⚠':''}</option>`).join('')||'<option value="">Ninguém disponível</option>'}</select></div></div><div class=row><button class="btn p" onclick="escalar()">Escalar</button><button class="btn g" onclick="auto()">✨ Preencher vagas automaticamente</button>${WA?`<label style="margin:0;font-weight:400"><input type=checkbox ${WAUTO?'checked':''} style="width:auto" onchange="WAUTO=this.checked;ls('waauto',WAUTO)"> 📲 Enviar WhatsApp automaticamente ao escalar</label>`:'<span class=mu><small>Para avisar pelo seu WhatsApp, use a 📲 Fila de envio.</small></span>'}</div></div>
<div class=card><div class=row style="margin:0;justify-content:space-between"><h3>Escala do culto</h3>${pend.length?`<button class="btn g s" onclick="fila(['${pend.join("','")}'])">📲 Fila de envio (${pend.length})</button>`:''}</div>${es.map(e=>`<div class=item><div class=gr><b>${esc(vn(e.vol).nome)}</b><div class=mu>${mi(e.min)} ${e.min} · ${esc(e.func)}</div>${chip(e.st)} ${envChip(e.id)}</div><div class=row style="margin:0">${WA?`<button class="btn s" onclick="enviarWA(['${e.id}'])">📲 Enviar</button>`:''}<a class="btn s" target=_blank rel=noopener href="${wa(e)}" onclick="marcarWA(['${e.id}'])">💬 ${WA?'Manual':'WhatsApp'}</a><a class="btn s" href="${ml(e)}">✉️</a><button class="btn s" onclick="cp('${e.id}')">🔗</button><button class="btn s" onclick="S.esc.find(x=>x.id=='${e.id}').st='faltou';save()">Falta</button><button class="btn s" onclick="S.esc=S.esc.filter(x=>x.id!='${e.id}');save()">🗑</button></div></div>`).join('')||'<p class=mu>Ninguém escalado neste culto.</p>'}</div>`}
function escalar(){const c=cu(sc);if(!c||!sv)return toast('Escolha culto, função e voluntário.');const x=conflito(sv,sc);if(x)return toast(`Conflito: ${vn(sv).nome} já está escalado(a) neste horário (${x.func}).`);const n=cnt(sv,c.data.slice(0,7)),ok=()=>{const e={id:uid(),culto:sc,vol:sv,min:sm,func:sf,st:'pendente',tok:tk()};S.esc.push(e);sv='';save().then(g=>g&&waAuto([e.id]));toast(WA&&WAUTO?'Escalado! Enviando WhatsApp…':'Escalado! Envie o link pelo WhatsApp/e-mail abaixo.')};n>=S.lim?dlg(`${esc(vn(sv).nome)} já tem ${n} escala(s) neste mês (limite ${S.lim}). Escalar mesmo assim?`,0,ok):ok()}
function auto(){const c=cu(sc);if(!c)return;let n=0;const ids=[];for(const m in M){if(!okMin(c,m))continue;for(const f of M[m].f){if(S.esc.some(e=>e.culto==c.id&&e.func==f&&e.st!='recusado'))continue;const a=elig(c,f).find(x=>x.ok&&x.n<S.lim);if(a){const e={id:uid(),culto:c.id,vol:a.v.id,min:m,func:f,st:'pendente',tok:tk()};S.esc.push(e);ids.push(e.id);n++}}}save().then(g=>g&&ids.length&&(WA&&WAUTO?enviarWA(ids):fila(ids)));toast(n?`${n} vaga(s) preenchida(s). Envie os links.`:'Nenhuma vaga pôde ser preenchida.')}
function cp(id){const e=S.esc.find(x=>x.id==id),l=link(e);navigator.clipboard.writeText(l).then(()=>toast('Link copiado!')).catch(()=>dlg(`Copie o link:<input readonly value="${esc(l)}" onfocus="this.select()">`,0,()=>{}))}
function tVol(){if(ed)return`<div class=card><h3>${ed.id?'Editar':'Novo'} voluntário</h3>${volForm(ed)}<div class=row><button class="btn p" onclick="saveVol(false)">Salvar</button><button class=btn onclick="ed=null;render()">Cancelar</button></div></div>`;
return`<div class=card><div class=row style="margin:0;justify-content:space-between"><h3>Voluntários (${S.vols.length})</h3><button class="btn p s" onclick="ed={};render()">+ Novo</button></div>${S.vols.map(v=>`<div class=item><div class=gr><b>${esc(v.nome)}</b><div class=mu>${minsOf(v).map(m=>mi(m)).join('')} ${esc(v.funcs.join(', '))}<br>${v.disp.map(d=>DIAS[d].slice(0,3)).join('/')} ${esc(v.obs)} ${v.zap?'· '+esc(v.zap):''}</div></div><button class="btn s" onclick="ed={...vn('${v.id}')};render()">✏️</button><button class="btn s" onclick="dlg('Remover ${esc(v.nome)} e suas escalas?',0,()=>{S.vols=S.vols.filter(x=>x.id!='${v.id}');S.esc=S.esc.filter(x=>x.vol!='${v.id}');save()})">🗑</button></div>`).join('')}</div>`}
function addCulto(){const d=$('#cd-d').value,h=$('#cd-h').value;if(!d||!h)return toast('Informe data e horário.');const w=dow(d);if(!CD.includes(w))return toast('Cultos só aos domingos, quartas ou sábados.');if(S.cultos.some(c=>c.data==d&&c.hora==h))return toast('Esse culto já existe.');S.cultos.push({id:uid(),data:d,dia:w,hora:h,tipo:$('#cd-t').value.trim()||'Culto de '+DIAS[w]});save()}
function genMes(){let n=0;gen(ym).forEach(c=>{if(!S.cultos.some(x=>x.data==c.data&&x.hora==c.hora)){S.cultos.push(c);n++}});save();toast(n+' culto(s) criado(s).')}
function tCul(){return`<div class=card><h3>Novo culto/evento</h3><div class=grid><div><label>Data</label><input id=cd-d type=date></div><div><label>Horário</label><input id=cd-h type=time value="19:00"></div><div><label>Tipo</label><input id=cd-t placeholder="Ex.: Culto de Domingo"></div></div><div class=row><button class="btn p" onclick="addCulto()">Adicionar</button></div></div><div class=card><div class=row style="margin:0;justify-content:space-between"><h3>Cultos do mês</h3><button class="btn g s" onclick="genMes()">✨ Gerar dom/qua/sáb do mês</button></div>${mes()}${S.cultos.filter(c=>c.data.startsWith(ym)).sort((a,b)=>a.data.localeCompare(b.data)).map(c=>`<div class=item><div class=dt><b>${fd(c.data)}</b><small>${DIAS[c.dia].slice(0,3)}</small></div><div class=gr>${esc(c.tipo)}${c.dia==6?' 📡':''}</div><input type=time value="${c.hora}" style="width:120px" onchange="cu('${c.id}').hora=this.value;save()"><button class="btn s" onclick="dlg('Remover este culto e suas escalas?',0,()=>{S.cultos=S.cultos.filter(x=>x.id!='${c.id}');S.esc=S.esc.filter(x=>x.culto!='${c.id}');save()})">🗑</button></div>`).join('')||'<p class=mu>Nenhum culto neste mês.</p>'}</div>`}
function tRod(){const r=S.vols.map(v=>[v,cnt(v.id,ym)]).sort((a,b)=>b[1]-a[1]);return`<div class=card><h3>Rodízio justo</h3><div class=grid><div>${mes()}</div><div><label>Limite de escalas por mês</label><input type=number min=1 value="${S.lim}" onchange="S.lim=Math.max(1,+this.value||4);save()"></div></div></div><div class=card>${r.map(([v,n])=>`<div class=item><span class=gr>${esc(v.nome)}</span><span class="${n>=S.lim?'over':''}">${n}/${S.lim}${n>=S.lim?' ⚠ limite':''}</span><div class=bar style="flex:1"><i style="width:${Math.min(100,n/S.lim*100)}%"></i></div></div>`).join('')}</div>`}
const rows=ym=>S.esc.filter(e=>cu(e.culto)&&cu(e.culto).data.startsWith(ym)).map(e=>{const c=cu(e.culto);return{data:c.data,dia:DIAS[c.dia],hora:c.hora,min:e.min,func:e.func,vol:vn(e.vol).nome,st:e.st}}).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
function csv(){const q=x=>'"'+String(x).replace(/"/g,'""')+'"';dl(`escalas-${ym}.csv`,'\ufeff'+['Data;Dia;Horário;Ministério;Função;Voluntário;Status'].concat(rows(ym).map(x=>[x.data,x.dia,x.hora,x.min,x.func,x.vol,x.st].map(q).join(';'))).join('\n'),'text/csv')}
const pr=()=>{try{print()}catch(e){toast('Use Imprimir do navegador e salve como PDF.')}};
function tRel(){const R=rows(ym),bad=R.filter(x=>x.st=='recusado'||x.st=='faltou');return`<div class=card><h3>Relatórios</h3>${mes()}<div class="row noprint"><button class="btn p s" onclick="csv()">⬇ CSV</button><button class="btn s" onclick="pr()">🖨 PDF (imprimir)</button></div></div>`+Object.keys(M).map(m=>{const rs=R.filter(x=>x.min==m),by={};rs.forEach(x=>{const b=by[x.vol]=by[x.vol]||{aceito:0,pendente:0,recusado:0,faltou:0,t:0};b[x.st]++;b.t++});return`<div class=card><h3>${M[m].i} ${m} — ${rs.length} escalas</h3><div class=tbl><table><tr><th>Voluntário<th>Total<th>✔<th>⏳<th>✖<th>⚠</tr>${Object.entries(by).map(([n,b])=>`<tr><td>${esc(n)}<td>${b.t}<td>${b.aceito}<td>${b.pendente}<td>${b.recusado}<td>${b.faltou}</tr>`).join('')||'<tr><td colspan=6 class=mu>Sem escalas</tr>'}</table></div></div>`}).join('')+`<div class=card><h3>Faltas e recusas</h3><div class=tbl><table><tr><th>Data<th>Voluntário<th>Função<th>Status</tr>${bad.map(x=>`<tr><td>${fd(x.data)}<td>${esc(x.vol)}<td>${esc(x.min)} – ${esc(x.func)}<td>${chip(x.st)}</tr>`).join('')||'<tr><td colspan=4 class=mu>Nenhuma</tr>'}</table></div></div>`}
function tAdm(){return`<div class=card><h3>Líderes/administradores</h3><p class=mu>Só estes nomes acessam o painel.</p>${S.admins.map((a,i)=>`<div class=item><span class=gr>${esc(a)}</span>${S.admins.length>1?`<button class="btn s" onclick="S.admins.splice(${i},1);save()">🗑</button>`:''}</div>`).join('')}<div class=row><input id=na placeholder="Nome do novo líder" style="flex:1"><button class="btn p" onclick="const n=$('#na').value.trim();if(n){S.admins.push(n);save()}">Adicionar</button></div></div><div class=card><h3>🔔 Avisos no Telegram</h3><p class=mu>Receba no seu Telegram um aviso quando um voluntário aceitar, recusar ou pedir troca.</p><p>${TG=='ok'?'✅ Conectado.':TG=='sem_chat'?'⏳ Falta conectar: abra o seu bot no Telegram, envie <b>/start</b> e toque em “Conectar”.':'⚠ Não configurado: falta o token do bot no servidor (veja o README).'}</p><div class=row>${TG!='off'?`<button class="btn p s" onclick="tgConectar()">${TG=='ok'?'Reconectar':'Conectar meu Telegram'}</button>`:''}${TG=='ok'?`<button class="btn s" onclick="tgTeste()">Enviar teste</button>`:''}</div></div>`}
/* ---------- init ---------- */
const th=ls('tema');if(th)document.documentElement.dataset.theme=th;
addEventListener('hashchange',render);render();load();
setInterval(()=>{const a=document.activeElement;if(document.hidden||(a&&a.matches('input,select,textarea'))||reg||ed||document.querySelector('.ov'))return;load(1)},20000);
